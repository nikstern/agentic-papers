#:schema https://developers.openai.com/codex/config-schema.json

[mcp_servers.arxiv]
command = "uvx"
args = ["arxiv-mcp-server"]
enabled = true
required = false
startup_timeout_sec = 30
tool_timeout_sec = 120
enabled_tools = [
  "search_papers",
  "download_paper",
  "list_papers",
  "read_paper",
  "get_paper_latex",
  "list_paper_latex_sections",
  "get_paper_latex_section",
]
